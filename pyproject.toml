[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "cuemsnodeconf"
version = "0.1.0"
description = "CUEMS node discovery + adoption daemon (avahi/zeroconf, network_map.xml maintainer)"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = ["Ion Reguera <ion@stagelab.coop>"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Networking",
]
repository = "https://github.com/stagesoft/cuems-nodeconf"
homepage = "https://github.com/stagesoft/cuems-nodeconf"

[[tool.poetry.packages]]
include = "cuemsnodeconf"

[tool.poetry.dependencies]
python = "^3.11"
cuemsutils = ">=0.1.0rc5"
# The following are provided by Debian system packages and exposed to the
# venv via dh_virtualenv --use-system-packages (see debian/control):
#   python3-netifaces, python3-dbus, python3-zeroconf, python3-systemd

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-mock = "*"

[tool.poetry.scripts]
cuems-nodeconf = "cuemsnodeconf.run_nodeconf:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-ra", "--strict-markers"]
# Package lives at repo root (cuemsnodeconf/); make it importable without install.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
